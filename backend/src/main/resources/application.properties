spring.application.name=scopeledger
# Hosts such as Render/Railway/Fly inject PORT; SERVER_PORT remains for local overrides.
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful

# --- MySQL (override per environment via env vars; never commit real passwords) ---
# Managed databases usually require TLS: append &sslMode=REQUIRED to DB_URL (see DEPLOYMENT.md).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scopeledger_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
# Small pool + recycle connections before managed-DB idle timeouts close them.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.connection-timeout=30000

# --- Schema is owned by SQL scripts, never by Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# schema.sql is idempotent and runs on every start. Sample data is seeded ONCE by DemoDataSeeder,
# only when the database is empty, so restarts and redeploys keep real data. data-locations is
# blanked so Spring Boot does not re-run data.sql automatically.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=

# --- App settings ---
# Comma-separated list of origins allowed to call /api/** (set to your frontend URL in production)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
# Seed the 8-task sample project when the database is empty
app.seed.on-empty=${SEED_ON_EMPTY:true}
# One-click demo reset endpoint (POST /api/v1/demo/reset). Wipes ALL data; disable if exposed publicly.
app.demo.reset-enabled=${DEMO_RESET_ENABLED:true}
