spring.application.name=scopeledger
server.port=${SERVER_PORT:8080}

# --- MySQL (override per laptop via env vars; never commit real passwords) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scopeledger_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# --- Schema is owned by schema.sql/data.sql, never by Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# --- App settings ---
# Comma-separated list of origins allowed to call /api/**
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
# One-click demo reset endpoint (POST /api/v1/demo/reset). Disable outside demos.
app.demo.reset-enabled=${DEMO_RESET_ENABLED:true}
