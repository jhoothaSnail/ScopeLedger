# Test profile: in-memory H2 in MySQL mode, so tests never need a MySQL server.
spring.datasource.url=jdbc:h2:mem:scopeledger_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
